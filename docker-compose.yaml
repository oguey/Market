services:
  postgres:
    image: postgres:16
    container_name: market-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    container_name: market-mongo
    restart: unless-stopped
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- microservices
  inventory:
    build: { context: ./services, args: { SERVICE: inventory } }
    env_file: .env
    environment: { POSTGRES_HOST: postgres, OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318 }
    ports: ["8002:8000"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  payments:
    build: { context: ./services, args: { SERVICE: payments } }
    env_file: .env
    environment: { POSTGRES_HOST: postgres, OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318 }
    ports: ["8003:8000"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  catalog:
    build: { context: ./services, args: { SERVICE: catalog } }
    env_file: .env
    environment: { MONGO_HOST: mongo, OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318 }
    ports: ["8004:8000"]
    depends_on: { mongo: { condition: service_healthy } }
    restart: unless-stopped

  orders:
    build: { context: ./services, args: { SERVICE: orders } }
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      CATALOG_URL: http://catalog:8000
      INVENTORY_URL: http://inventory:8000
      PAYMENTS_URL: http://payments:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      catalog: { condition: service_started }
      inventory: { condition: service_started }
      payments: { condition: service_started }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  auth:
    build: { context: ./services, args: { SERVICE: auth } }
    env_file: .env
    environment: { POSTGRES_HOST: postgres, OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318 }
    ports: ["8005:8000"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped

  # Front + passerelle API (NGINX : verification du JWT, limite de debit)
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      orders: { condition: service_started }
      inventory: { condition: service_started }
      payments: { condition: service_started }
      catalog: { condition: service_started }
      auth: { condition: service_started }
    restart: unless-stopped

  # ---------------------------------------------------------------- observabilite (volet 3)
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: market-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: market-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definis GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]

  # Traces distribuees (OpenTelemetry) : une commande = une trace qui traverse les services
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    container_name: market-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # interface web
      - "4318:4318"     # reception OTLP/HTTP

  # ---------------------------------------------------------------- temps reel (volet 4)
  # Kafka en mode KRaft (un seul noeud, sans ZooKeeper). Les services parlent a kafka:9092.
  kafka:
    image: apache/kafka:3.9.1
    container_name: market-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Cree le topic des commandes : 3 partitions, cle = order_id (tous les evenements d'une commande restent dans l'ordre)
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "market.orders", "--partitions", "3", "--replication-factor", "1"]
    restart: "no"

  # Interface web pour Kafka : topics, messages, partitions, lag. http://localhost:8090
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: market-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: market
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports: ["8090:8080"]
    depends_on: { kafka: { condition: service_healthy } }

  # ---------------------------------------------------------------- data lake (volet 2)
  # Stockage S3 local. MinIO n'est plus distribue (images supprimees en 2026) : on utilise RustFS.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: market-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - lake_data:/data

  # Cree les 4 zones du lac au demarrage (attend que le stockage reponde), puis s'arrete.
  lake-init:
    image: amazon/aws-cli:latest
    container_name: market-lake-init
    depends_on: [rustfs]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1 && break; sleep 2; done;
      for zone in raw staging curated consumption; do aws --endpoint-url http://rustfs:9000 s3 mb s3://$$zone || true; done;
      aws --endpoint-url http://rustfs:9000 s3 ls"

  # Copie PostgreSQL + MongoDB vers la zone raw. A lancer a la demande :
  #   docker compose run --rm lake-extract
  lake-extract:
    build: ./lake/extract
    container_name: market-lake-extract
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      lake-init: { condition: service_completed_successfully }
    restart: "no"
    profiles: ["jobs"]

  # Nettoyage raw -> staging avec Spark. A lancer a la demande :
  #   docker compose run --rm lake-staging
  lake-staging:
    build: ./lake/spark
    container_name: market-lake-staging
    env_file: .env
    environment:
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      lake-init: { condition: service_completed_successfully }
      lake-extract: { condition: service_completed_successfully }
    restart: "no"
    profiles: ["jobs"]

  # Spark Structured Streaming : Kafka -> fenetres d'1 min -> alertes + Delta. Metriques sur :8008.
  #   Arret volontaire pour la demo de panne :  docker compose stop stream-orders   puis   docker compose start stream-orders
  stream-orders:
    build: ./lake/spark
    container_name: market-stream-orders
    command: ["python", "stream_orders.py"]
    env_file: .env
    environment:
      S3_ENDPOINT: http://rustfs:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - stream_ckpt:/checkpoints
    ports: ["8008:8008"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      lake-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Pseudonymisation, controles qualite et tables Delta : staging -> curated.
  #   docker compose run --rm lake-curated
  lake-curated:
    build: ./lake/spark
    container_name: market-lake-curated
    command: ["python", "curated.py"]
    env_file: .env
    environment:
      S3_ENDPOINT: http://rustfs:9000
    depends_on:
      lake-init: { condition: service_completed_successfully }
      lake-staging: { condition: service_completed_successfully }
    restart: "no"
    profiles: ["jobs"]

  # Tables d'analyse + catalogue de donnees : curated -> consumption.
  #   docker compose run --rm lake-consumption
  lake-consumption:
    build: ./lake/spark
    container_name: market-lake-consumption
    command: ["python", "consumption.py"]
    env_file: .env
    environment:
      S3_ENDPOINT: http://rustfs:9000
      CATALOG_OUT: /docs/DATA_CATALOG.md
    volumes:
      - ./docs:/docs
    depends_on:
      lake-init: { condition: service_completed_successfully }
      lake-curated: { condition: service_completed_successfully }
    restart: "no"
    profiles: ["jobs"]

volumes:
  stream_ckpt:
  kafka_data:
  pg_data:
  mongo_data:
  lake_data:
  prometheus_data:
  grafana_data:
# API gateway + static front.
#   - point d'entree unique : le navigateur ne parle qu'a ce serveur (port 3000)
#   - verifie le JWT avant de transmettre une requete a un service (auth_request -> auth /v1/auth/me)
#   - limite le debit par adresse IP (429 au-dela)
# Les services re-verifient quand meme le jeton eux-memes (ADR-006, defense en profondeur).

# 20 requetes/s par IP pour l'API ; 10 tentatives de connexion par minute (rafale de 5 tolérée) (freine le brute force).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS; upstreams are resolved per request so nginx starts even if a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Erreurs de la passerelle en JSON, comme les services.
    error_page 401 = @unauthorized;
    error_page 429 = @too_many_requests;
    location @unauthorized {
        internal;
        default_type application/json;
        add_header WWW-Authenticate "Bearer" always;
        return 401 '{"detail":"not authenticated"}';
    }
    location @too_many_requests {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"detail":"too many requests"}';
    }

    # Sous-requete interne : le service auth valide la signature et l'expiration du jeton d'acces
    # (un refresh token est refuse). 200 = valide, 401 = refuse.
    location = /_auth {
        internal;
        set $auth_upstream http://auth:8000;
        proxy_pass $auth_upstream/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # --- Auth : seuls login et refresh sont publics --------------------------------------------
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        set $upstream http://auth:8000;
        rewrite ^ /v1/auth/login break;
        proxy_pass $upstream;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /api/auth/refresh {
        limit_req zone=api_zone burst=40 nodelay;
        set $upstream http://auth:8000;
        rewrite ^ /v1/auth/refresh break;
        proxy_pass $upstream;
        proxy_set_header X-Request-Id $request_id;
    }

    # /api/auth/me, /api/auth/users : jeton obligatoire (droits verifies par le service)
    location ~ ^/api/auth/(.*)$ {
        limit_req zone=api_zone burst=40 nodelay;
        auth_request /_auth;
        set $upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /v1/auth/$1 break;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
    }

    # --- Services metier : jeton obligatoire ---------------------------------------------------
    location ~ ^/api/(orders|inventory|payments|catalog)/(.*)$ {
        limit_req zone=api_zone burst=40 nodelay;
        auth_request /_auth;
        set $upstream http://$1:8000;
        rewrite ^/api/[a-z]+/(.*)$ /v1/$1 break;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $request_id;
    }

    # Sondes et metriques (utilisees par l'onglet Observabilite du front).
    location ~ ^/health/(orders|inventory|payments|catalog|auth)$ {
        limit_req zone=api_zone burst=40 nodelay;
        set $upstream http://$1:8000;
        rewrite ^ /health break;
        proxy_pass $upstream;
    }

    location ~ ^/metrics/(orders|inventory|payments|catalog|auth)$ {
        limit_req zone=api_zone burst=40 nodelay;
        set $upstream http://$1:8000;
        rewrite ^ /metrics break;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

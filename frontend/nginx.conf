server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS; upstreams are resolved per request so nginx starts even if a service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Login, refresh and /me: /api/auth/login -> auth:8000/v1/auth/login
    location ~ ^/api/auth/(.*)$ {
        set $upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /v1/auth/$1 break;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/api/(orders|inventory|catalog)/(.*)$ {
        set $upstream http://$1:8000;
        rewrite ^/api/[a-z]+/(.*)$ /v1/$1 break;
        proxy_pass $upstream;
        proxy_set_header Authorization $http_authorization;
    }

    location ~ ^/health/(orders|inventory|payments|catalog|auth)$ {
        set $upstream http://$1:8000;
        rewrite ^ /health break;
        proxy_pass $upstream;
    }

    location ~ ^/metrics/(orders|inventory|payments|catalog|auth)$ {
        set $upstream http://$1:8000;
        rewrite ^ /metrics break;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
